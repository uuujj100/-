<style>

    position: fixed; top: 36px; width: 100%; text-align: center; pointer-events: none;

<script>
  // 把任何报错显示到页面上，方便排查
  function showErr(msg){ const e=document.getElementById('err'); e.style.display='block'; e.textContent += msg + '\n'; }
  addEventListener('error', e => showErr('Error: ' + (e.message || e.type) + (e.filename ? '\n@ ' + e.filename + ':' + e.lineno : '')));
  addEventListener('unhandledrejection', e => showErr('Promise Error: ' + (e.reason && e.reason.message || e.reason)));
</script>

<body>

<div id="title">✦ Merry Christmas ✦</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============ 渲染器 / 场景 / 相机 ============ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
/* ===== 设备能力探测 ===== */
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
  || Math.min(innerWidth, innerHeight) < 520
  || (navigator.hardwareConcurrency || 8) <= 4;
const PERF = IS_MOBILE ? 0.45 : 1;
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, IS_MOBILE ? 1.0 : 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1233, 0.016);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 6.5, 24);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.maxPolarAngle = Math.PI / 2.03;
controls.minDistance = 10;
controls.maxDistance = 45;

// PBR 环境反射
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const std = (o) => new THREE.MeshStandardMaterial({ envMapIntensity: 0.35, ...o });
const animatedUniforms = [];

/* ============ 工具：发光贴图 ============ */
function makeGlowTexture(size = 128, spikes = false) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.2, 'rgba(255,255,255,0.75)');
  grd.addColorStop(0.55, 'rgba(255,255,255,0.15)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, size, size);
  if (spikes) {
    g.globalCompositeOperation = 'lighter';
    for (const rot of [0, Math.PI / 2]) {
      g.save(); g.translate(size/2, size/2); g.rotate(rot); g.scale(1, 0.06);
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, size/2);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, size/2, 0, Math.PI * 2); g.fill(); g.restore();
    }
  }
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture(128, false);
const sparkTex = makeGlowTexture(128, true);

/* ============ 极光天空 ============ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vDir;
    void main(){ vDir = (modelMatrix * vec4(position,1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uTime; varying vec3 vDir;
    float hash21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0.0,a=0.5; mat2 m=mat2(1.6,1.2,-1.2,1.6);
      for(int i=0;i<5;i++){ v+=a*noise(p); p=m*p; a*=0.5; } return v; }
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 col = mix(vec3(0.045,0.075,0.19), vec3(0.004,0.008,0.03), smoothstep(-0.05,0.55,h));
      col += vec3(0.20,0.08,0.24) * pow(max(0.0,1.0-abs(h+0.02)*4.0),3.0) * 0.45;
      float az = atan(d.z,d.x); float hh = max(h,0.0);
      float n1 = fbm(vec2(az*1.8 + uTime*0.03, uTime*0.05));
      float n2 = fbm(vec2(az*4.0 - uTime*0.04, hh*3.0 + uTime*0.08));
      float center = 0.20 + n1*0.32;
      float band = exp(-pow((hh-center)*3.2, 2.0));
      float curtain = fbm(vec2(az*9.0 + n2*2.5, hh*6.0 - uTime*0.12));
      float aur = band * (0.3 + 0.7*curtain) * smoothstep(0.0,0.12,hh);
      vec3 ac = mix(vec3(0.05,0.95,0.45), vec3(0.35,0.2,1.0), smoothstep(0.08,0.55,hh));
      ac = mix(ac, vec3(1.0,0.35,0.65), pow(curtain,3.0)*0.7);
      col += ac * aur * 0.75;
      vec3 sp = d*140.0; vec3 cell = floor(sp); vec3 f = fract(sp)-0.5;
      float s = hash21(cell.xy*1.7 + cell.z*3.1);
      float star = step(0.991, s) * smoothstep(0.32,0.0,length(f));
      float tw = 0.55 + 0.45*sin(uTime*2.0 + s*400.0);
      col += vec3(0.9,0.95,1.0) * star * tw * smoothstep(0.0,0.15,h) * 1.6;
      gl_FragColor = vec4(col,1.0);
    }`
});
animatedUniforms.push(skyMat);
const sky = new THREE.Mesh(new THREE.SphereGeometry(220, 64, 32), skyMat);
scene.add(sky);

// 月亮 + 光晕
const moonPos = new THREE.Vector3(-95, 90, -120);
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(6, 32, 32),
  new THREE.MeshBasicMaterial({ color: new THREE.Color(0xdfe9ff).multiplyScalar(1.8), fog: false }));
moonMesh.position.copy(moonPos); scene.add(moonMesh);
const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x9fb8ff, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
moonHalo.scale.setScalar(70); moonHalo.position.copy(moonPos); scene.add(moonHalo);

/* ============ 灯光 ============ */
scene.add(new THREE.AmbientLight(0x1c2a55, 0.7));

const moonLight = new THREE.DirectionalLight(0xb8ccff, 1.6);
moonLight.position.set(-18, 30, -16);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = moonLight.shadow.camera.bottom = -24;
moonLight.shadow.camera.right = moonLight.shadow.camera.top = 24;
moonLight.shadow.camera.near = 1; moonLight.shadow.camera.far = 100;
moonLight.shadow.bias = -0.0004; moonLight.shadow.normalBias = 0.03;
scene.add(moonLight, moonLight.target);

const warm = new THREE.PointLight(0xffb066, 70, 30, 2); warm.position.set(0, 6, 0); scene.add(warm);
const pinkFill = new THREE.PointLight(0xff5fa8, 60, 30, 2); pinkFill.position.set(-9, 4, 6); scene.add(pinkFill);
const cyanFill = new THREE.PointLight(0x4fd8ff, 60, 30, 2); cyanFill.position.set(9, 5, -5); scene.add(cyanFill);

/* ============ 地面（起伏雪原） ============ */
function groundH(x, z) {
  const d = Math.hypot(x, z);
  const k = THREE.MathUtils.smoothstep(d, 5, 18);
  return k * (Math.sin(x * 0.25) * Math.cos(z * 0.21) * 0.9 + Math.sin(x * 0.6 + z * 0.4) * 0.3 + Math.sin(z * 0.9 + x * 0.1) * 0.15);
}
const groundGeo = new THREE.PlaneGeometry(170, 170, 220, 220);
{
  const p = groundGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, groundH(p.getX(i), -p.getY(i)));
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, std({ color: 0xdfe8ff, roughness: 0.9, envMapIntensity: 0.25 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const mound = new THREE.Mesh(new THREE.SphereGeometry(4.8, 40, 20), std({ color: 0xeef3ff, roughness: 0.95 }));
mound.scale.set(1, 0.18, 1); mound.receiveShadow = true; mound.castShadow = true; scene.add(mound);

/* ============ 圣诞树 ============ */
const tree = new THREE.Group(); scene.add(tree);

// ✅ 修复：树干改为常规写法
const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.65, 2.2, 12), std({ color: 0x4b2f17, roughness: 0.95 }));
trunk.position.y = 1; trunk.castShadow = true; tree.add(trunk);

const layers = [
  { r: 4.2, h: 4.0, y: 3.2 }, { r: 3.4, h: 3.6, y: 5.3 }, { r: 2.6, h: 3.2, y: 7.3 },
  { r: 1.8, h: 2.8, y: 9.1 }, { r: 1.0, h: 2.2, y: 10.6 },
];
const leafMat = std({ color: 0x1b6b36, roughness: 0.85, flatShading: true, envMapIntensity: 0.3 });
const capMat = std({ color: 0xf6f9ff, roughness: 1, envMapIntensity: 0.3 });
layers.forEach(l => {
  const cone = new THREE.Mesh(new THREE.ConeGeometry(l.r, l.h, 11, 1), leafMat);
  cone.position.y = l.y; cone.castShadow = true; cone.receiveShadow = true; tree.add(cone);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(l.r * 0.55, l.h * 0.4, 11, 1), capMat);
  cap.position.y = l.y + l.h * 0.3; cap.castShadow = true; tree.add(cap);
});
const TOP_Y = 11.8;
function radiusAt(y) {
  let r = 0;
  for (const l of layers) {
    const b = l.y - l.h / 2, t = l.y + l.h / 2;
    if (y >= b && y <= t) r = Math.max(r, l.r * (1 - (y - b) / l.h) + 0.15);
  }
  return r;
}

// 金色丝带
{
  const pts = [];
  for (let i = 0; i <= 400; i++) {
    const t = i / 400, y = 1.8 + t * 9.4, r = radiusAt(y) + 0.12, a = t * Math.PI * 10;
    pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  const ribbon = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 700, 0.07, 8, false),
    std({ color: 0xffc94d, metalness: 1, roughness: 0.25, envMapIntensity: 1.5, emissive: 0x553300, emissiveIntensity: 0.3 }));
  ribbon.castShadow = true; tree.add(ribbon);
}

// 彩球
const ballColors = [0xff2e4d, 0xffc400, 0x2e8bff, 0xff66cc, 0xe8e8e8, 0xff7a1a];
const ballGeo = new THREE.SphereGeometry(0.22, 20, 20);
for (let i = 0; i < 90; i++) {
  const y = 1.6 + Math.random() * 9.4, r = radiusAt(y);
  if (r < 0.3) continue;
  const a = Math.random() * Math.PI * 2, c = ballColors[i % ballColors.length];
  const ball = new THREE.Mesh(ballGeo, std({ color: c, emissive: c, emissiveIntensity: 0.2, metalness: 0.9, roughness: 0.15, envMapIntensity: 1.3 }));
  ball.position.set(Math.cos(a) * r, y, Math.sin(a) * r); ball.castShadow = true; tree.add(ball);
}

// 螺旋彩灯
const bulbs = [];
const bulbGeo = new THREE.SphereGeometry(0.09, 8, 8);
const bulbColors = [0xffe680, 0xff4d6d, 0x4dff88, 0x4dc3ff, 0xffffff, 0xff9de2];
for (let i = 0; i < 280; i++) {
  const t = i / 280, y = 1.6 + t * 9.8, r = radiusAt(y);
  if (r < 0.25) continue;
  const a = t * Math.PI * 16, base = new THREE.Color(bulbColors[i % bulbColors.length]).multiplyScalar(2.6);
  const b = new THREE.Mesh(bulbGeo, new THREE.MeshBasicMaterial({ color: base.clone() }));
  b.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
  b.userData = { phase: Math.random() * Math.PI * 2, speed: 1.5 + Math.random() * 2, base };
  bulbs.push(b); tree.add(b);
}

// 顶部星星
function starShape(outer, inner, n = 5) {
  const s = new THREE.Shape();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 === 0 ? outer : inner, a = (i / (n * 2)) * Math.PI * 2 + Math.PI / 2;
    i === 0 ? s.moveTo(Math.cos(a) * r, Math.sin(a) * r) : s.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  s.closePath(); return s;
}
const star = new THREE.Mesh(
  new THREE.ExtrudeGeometry(starShape(0.9, 0.4), { depth: 0.25, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05 }),
  std({ color: 0xffd54a, emissive: 0xffb300, emissiveIntensity: 2.2, metalness: 0.7, roughness: 0.25, envMapIntensity: 1.2 }));
star.geometry.center(); star.position.y = TOP_Y + 0.35; tree.add(star);
const starLight = new THREE.PointLight(0xffd27a, 40, 14, 2); starLight.position.copy(star.position); tree.add(starLight);
const starGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkTex, color: 0xffe2a0, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
starGlow.scale.setScalar(5); starGlow.position.copy(star.position); tree.add(starGlow);

/* ============ 礼物盒 ============ */
function gift(x, z, w, h, d, color, ribbon) {
  const g = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), std({ color, roughness: 0.55 }));
  box.castShadow = true; box.receiveShadow = true; g.add(box);
  const rm = std({ color: ribbon, metalness: 0.6, roughness: 0.25, envMapIntensity: 1 });
  g.add(new THREE.Mesh(new THREE.BoxGeometry(w * 1.02, h * 1.02, d * 0.18), rm));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(w * 0.18, h * 1.02, d * 1.02), rm));
  const bow = new THREE.Mesh(new THREE.TorusKnotGeometry(0.18, 0.06, 48, 8, 2, 3), rm);
  bow.position.y = h / 2 + 0.12; bow.castShadow = true; g.add(bow);
  g.position.set(x, groundH(x, z) + h / 2, z); g.rotation.y = Math.random() * Math.PI; scene.add(g);
}
gift(4.4, 2.6, 1.6, 1.2, 1.6, 0xd62839, 0xffd54a);
gift(-4.6, 1.9, 1.2, 1.0, 1.2, 0x2a6df4, 0xffffff);
gift(3.1, -3.9, 1.0, 1.4, 1.0, 0x2fa84f, 0xff4d6d);
gift(-2.9, -4.3, 1.8, 0.9, 1.4, 0xf6f0e8, 0xd62839);
gift(5.8, -1.3, 0.9, 0.9, 0.9, 0xffb347, 0x2a6df4);

/* ============ 地灯 ============ */
const lanternLights = [];
function lantern(x, z) {
  const g = new THREE.Group();
  const darkMetal = std({ color: 0x161a20, metalness: 0.8, roughness: 0.4 });
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 2.6, 8), std({ color: 0x1f262f, metalness: 0.7, roughness: 0.5 }));
  post.position.y = 1.3; post.castShadow = true; g.add(post);
  const cage = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.5), darkMetal);
  cage.position.y = 2.9; cage.castShadow = true; g.add(cage);
  const glassMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffb060).multiplyScalar(2.4) });
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.44, 0.34), glassMat); glass.position.y = 2.9; g.add(glass);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.48, 0.32, 4), darkMetal);
  roof.position.y = 3.36; roof.rotation.y = Math.PI / 4; g.add(roof);
  const light = new THREE.PointLight(0xffb060, 16, 16, 2); light.position.y = 2.7; g.add(light);
  lanternLights.push({ light, glassMat, phase: Math.random() * 10 });
  g.position.set(x, groundH(x, z), z); scene.add(g);
}
[[9, 6], [-9.5, 5.5], [8, -8], [-8.5, -8.5]].forEach(([x, z]) => lantern(x, z));

const beamMat = (color, opacity) => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(color) }, uOpacity: { value: opacity } },
  vertexShader: `
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){ vUv = uv; vN = normalize(normalMatrix*normal);
      vec4 mv = modelViewMatrix*vec4(position,1.0); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `
    uniform vec3 uColor; uniform float uTime; uniform float uOpacity;
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      float fres = pow(abs(dot(normalize(vN), normalize(vV))), 1.6);
      float h = smoothstep(0.0,0.75,vUv.y) * smoothstep(1.0,0.86,vUv.y);
      float flicker = 0.8 + 0.2*sin(uTime*0.6 + vUv.x*14.0) * sin(uTime*0.37 + vUv.y*5.0);
      gl_FragColor = vec4(uColor, fres*h*flicker*uOpacity);
    }`
});
const beams = new THREE.Group(); scene.add(beams);

const particleFrag = `
  uniform sampler2D uTex; uniform vec3 uColor; uniform float uOpacity; varying float vA;
  void main(){ float a = texture2D(uTex, gl_PointCoord).a * vA * uOpacity; if(a < 0.003) discard;
    gl_FragColor = vec4(uColor, a); }`;
const staticVert = `
  attribute float aSize; attribute float aPhase;
  uniform float uTime, uFog, uTwinkle, uMin, uSpeed, uScale; varying float vA;
  void main(){
    vec4 mv = modelViewMatrix * vec4(position,1.0); float dist = -mv.z;
    float tw = pow(0.5 + 0.5*sin(uTime*uSpeed + aPhase), uTwinkle);
    vA = mix(uMin, 1.0, tw) * exp(-pow(dist*uFog, 2.0));
    gl_PointSize = min(aSize * (0.55 + 0.45*tw) * uScale / dist, 70.0);
    gl_Position = projectionMatrix * mv; }`;
function particleMat(vert, tex, color, opts) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: opts.additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    uniforms: {
      uTime: { value: 0 }, uTex: { value: tex }, uColor: { value: color }, uOpacity: { value: opts.opacity ?? 1 },
      uFog: { value: opts.fog ?? 0.02 }, uTwinkle: { value: opts.twinkle ?? 1 }, uMin: { value: opts.min ?? 0.5 },
      uSpeed: { value: opts.speed ?? 2 }, uScale: { value: opts.scale ?? 160 },
    },
    vertexShader: vert, fragmentShader: particleFrag,
  });
  animatedUniforms.push(m); return m;
}

/* 雪花改为 GPU 计算：位置全部在 vertex shader 里算，CPU 每帧零开销 */
const snowVert = `
  attribute float aSize; attribute float aPhase; attribute float aVel; attribute float aSway;
  uniform float uTime, uFog, uTwinkle, uMin, uSpeed, uScale, uHeight;
  varying float vA;
  void main(){
    vec3 p = position;
    p.y = mod(p.y - uTime * aVel, uHeight);
    p.x += sin(uTime * 0.7 + aSway) * 0.9;
    p.z += cos(uTime * 0.5 + aSway) * 0.6;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float dist = -mv.z;
    float tw = pow(0.5 + 0.5*sin(uTime*uSpeed + aPhase), uTwinkle);
    vA = mix(uMin, 1.0, tw) * exp(-pow(dist*uFog, 2.0));
    gl_PointSize = min(aSize * (0.55 + 0.45*tw) * uScale / dist, 70.0);
    gl_Position = projectionMatrix * mv;
  }`;

{
  const N = 1200, dummy = new Float32Array(N * 3), seed = new Float32Array(N), size = new Float32Array(N), phase = new Float32Array(N);
  for (let i = 0; i < N; i++) { seed[i] = Math.random(); size[i] = 0.12 + Math.random() * 0.3; phase[i] = Math.random() * Math.PI * 2; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(dummy, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  dust = new THREE.Points(g, particleMat(dustVert, sparkTex, new THREE.Color(2.2, 1.6, 0.7), { additive: true, fog: 0.02, scale: 150 }));
  dust.frustumCulled = false; scene.add(dust);
}

/* ============ 低空薄雾 ============ */
const mist = new THREE.Group(); scene.add(mist);
for (let i = 0; i < 18; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x8fb0ff, transparent: true, opacity: 0.10 + Math.random() * 0.08, depthWrite: false }));
  const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * 22;
  s.position.set(Math.cos(a) * r, 0.8 + Math.random() * 1.2, Math.sin(a) * r);
  s.scale.set(14 + Math.random() * 10, 5 + Math.random() * 3, 1);
  s.userData = { phase: Math.random() * 10, speed: 0.15 + Math.random() * 0.2, baseOp: s.material.opacity };
  mist.add(s);
}

/* ============ 后期处理 ============ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bokehPass = new BokehPass(scene, camera, { focus: 24, aperture: 0.0003, maxblur: 0.006 });
const dofExclude = [snow, dust, sparkles, mist, beams, moonHalo, starGlow, sky];
const _bokehRender = bokehPass.render.bind(bokehPass);
bokehPass.render = (...args) => {
  dofExclude.forEach(o => o.visible = false);
  _bokehRender(...args);
  dofExclude.forEach(o => o.visible = true);
};
if (!IS_MOBILE) composer.addPass(bokehPass);  // 景深在手机上代价过高，直接跳过

const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.62, 0.8, 0.87);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const gradePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
    void main(){
      vec2 d = vUv - 0.5;
      float ca = 0.0028 * dot(d,d) * 4.0;
      vec3 col = vec3(texture2D(tDiffuse, vUv + d*ca).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - d*ca).b);
      col = mix(col, col*vec3(1.02,0.99,1.04) + vec3(0.004,0.006,0.020), 0.42);
      col = pow(col, vec3(0.98));
      float v = smoothstep(1.0, 0.25, length(d)*1.25);
      col *= mix(0.5, 1.0, v);
      float n = fract(sin(dot(vUv*uRes + mod(uTime,100.0)*137.0, vec2(12.9898,78.233)))*43758.5453);
      col += (n - 0.5) * 0.03;
      gl_FragColor = vec4(col, 1.0);
    }`
});
composer.addPass(gradePass);

/* ============ 动画循环 ============ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  /* 雪花位置由 GPU 计算，这里不再逐帧更新 */

  for (const m of animatedUniforms) m.uniforms.uTime.value = t;
  gradePass.uniforms.uTime.value = t;

  for (const b of bulbs) {
    const k = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * b.userData.speed + b.userData.phase));
    b.material.color.copy(b.userData.base).multiplyScalar(k);
  }

  star.rotation.y = t * 0.7;
  for (const pc of photoCards) {
    pc.pivot.rotation.z = Math.sin(t * 0.6 + pc.phase) * 0.05;
    pc.pivot.rotation.x = Math.cos(t * 0.45 + pc.phase) * 0.03;
  }
  star.scale.setScalar(1 + Math.sin(t * 2) * 0.06);
  starGlow.scale.setScalar(4.5 + Math.sin(t * 2) * 0.8);
  starGlow.material.rotation = t * 0.3;
  starLight.intensity = 34 + Math.sin(t * 2) * 12;
  warm.intensity = 66 + Math.sin(t * 1.3) * 8;
  pinkFill.intensity = 55 + Math.sin(t * 0.8) * 15;
  cyanFill.intensity = 55 + Math.cos(t * 0.9) * 15;
  for (const l of lanternLights) {
    const f = 0.85 + 0.15 * Math.sin(t * 7 + l.phase) * Math.sin(t * 3.1 + l.phase * 2);
    l.light.intensity = 16 * f;
    l.glassMat.color.setRGB(2.4 * f, 1.65 * f, 0.9 * f);
  }

  for (const s of mist.children) {
    s.position.x += Math.sin(t * 0.1 + s.userData.phase) * dt * s.userData.speed;
    s.position.z += Math.cos(t * 0.13 + s.userData.phase) * dt * s.userData.speed * 0.6;
    s.material.opacity = s.userData.baseOp * (0.75 + 0.25 * Math.sin(t * 0.4 + s.userData.phase));
  }

  bokehPass.uniforms.focus.value = controls.getDistance();

  controls.update();
  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  gradePass.uniforms.uRes.value.set(innerWidth, innerHeight);
});
</script>
